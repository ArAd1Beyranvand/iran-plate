name: iran_plate_example
description: Minimal example — rendering an Iranian car plate.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  core_plate: ^0.1.0
  iran_plate: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

# Local development only — resolves the iran_plate package from the sibling
# checkout until it is published on pub.dev. A fresh consumer copying this
# example deletes this block and relies on the versioned dependencies above.
dependency_overrides:
  iran_plate:
    path: ../

