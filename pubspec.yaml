name: iran_plate
description: "Iran's licence plates for the plate_core library — country panels, the Persian alphabets, and the Iranian plate specs."
version: 0.6.0
homepage: https://github.com/ArAd1Beyranvand/iran-plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine. 0.6.0 is required for plateRegister, 0.9.1
  # for PlateLabel.color (the Bahraini bands' reversed-out captions).
  plate_core: ^0.11.5
  # Shared alphabet definitions.
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # This package OWNS the flag it names. `IranCountry.iran`'s SvgPlateAsset says
  # `package: 'iran_plate'`, and an asset reference resolves against the bundle
  # of the package that declares it — so the literal and this block have to move
  # together or the flag silently keeps working off a stale bundle locally and
  # fails for a fresh consumer.
  assets:
    - assets/flags/Flag_of_Iran.svg

