name: iran_plate
description: "Iran's licence plates for the core_plate library — the country panel, the Persian alphabets, and the car and bicycle specs."
version: 0.2.0
homepage: https://github.com/ArAd1Beyranvand/iran-plate

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine. 0.6.0 is required for plateRegister.
  core_plate: ^0.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # This package OWNS the flag it names. `IranCountry.iran`'s SvgPlateAsset says
  # `package: 'iran_plate'`, and an asset reference resolves against the bundle
  # of the package that declares it — so the literal and this block have to move
  # together or the flag silently keeps working off a stale bundle locally and
  # fails for a fresh consumer.
  assets:
    - assets/flags/Flag_of_Iran.svg

