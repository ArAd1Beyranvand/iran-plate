name: iran_plate
description: "Iran's licence plates for the plate_number / core_plate library — the country panel, the Persian alphabets, and the car and bicycle specs."
version: 0.1.0
homepage: https://github.com/ArAdBey/plate-number

# Provisional: the core dependency is a path during development, which is
# incompatible with publishing. P9 decides pub.dev vs path-only (PLAN.md §6.6);
# if it picks pub.dev this line goes and `plate_number` becomes a version range.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The core package. Still named `plate_number`; becomes `core_plate` in P9 of
  # the split, at which point this one line changes.
  plate_number:
    path: ../plate-core

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # This package OWNS the flag it names. `IranCountry.iran`'s SvgPlateAsset says
  # `package: 'iran_plate'`, and an asset reference resolves against the bundle
  # of the package that declares it — so the literal and this block have to move
  # together or the flag silently keeps working off a stale bundle locally and
  # fails for a fresh consumer.
  assets:
    - assets/flags/Flag_of_Iran.svg
